title = "Project Gitleaks Configuration"

[extend]
useDefault = true

# Disable specific default rules if needed
# disabledRules = ["generic-api-key"]

# Global allowlists for common false positives
[[allowlists]]
description = "Ignore baseline and config files"
paths = [
  '''\.secrets\.baseline$''',
  '''\.gitleaks\.toml$''',
  '''\.gitleaksignore$''',
  '''package\.lock\.json$''',
]

[[allowlists]]
description = "Ignore test files"
paths = [
  '''test_.*\.py$''',
  '''.*_test\.py$''',
  '''tests/.*''',
  '''__tests__/.*''',
]
stopwords = [
  '''test''',
  '''example''',
  '''mock''',
  '''dummy''',
  '''fake''',
]

